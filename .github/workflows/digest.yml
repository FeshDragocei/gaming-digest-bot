name: Игровые новости

on:
  schedule:
    # Проверка каждые 30 минут. Время в GitHub Actions — UTC (Москва = UTC+3).
    - cron: "7,37 * * * *"
  workflow_dispatch:        # кнопка «Run workflow» — выпустить следующую новость сейчас

concurrency:
  group: digest            # одна проверка за раз; следующие ждут своей очереди
  cancel-in-progress: false

permissions:
  contents: write           # чтобы workflow мог сохранить историю новостей

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35     # паузы между постами + запас на сбор новостей
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Проверить новости и опубликовать
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          NEWS_PER_RUN: "5"
          TOPIC_BATCH_CAP: "3"
          TOPIC_DAILY_CAP: "8"
          FRESH_HOURS: "12"
          TIMEZONE: Europe/Moscow
        run: python scripts/publish_now.py

      - name: Сохранить историю опубликованных новостей
        run: |
          git config user.name "digest-bot"
          git config user.email "action@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: обновить историю и состояние [skip ci]"
          git pull --rebase origin main
          git push
